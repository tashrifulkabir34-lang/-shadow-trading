[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "shadow-trading"
version = "1.0.0"
description = "Replication of Mehta, Reeb & Zhao (2020) Shadow Trading — The Accounting Review"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "linearmodels>=5.3",
    "matplotlib>=3.7.0",
    "jinja2>=3.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "flake8>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["shadow_trading"]
omit = ["*/tests/*", "*/visualization/tearsheet.py"]
